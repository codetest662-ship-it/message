{% extends "base.html" %}
{% block title %}Create Account — Chatly{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Create Account</h1>
  <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" type="text" name="username" required />
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required />
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required />
    </div>
    <div class="field">
      <label for="bio">Bio</label>
      <textarea id="bio" name="bio" rows="2"></textarea>
    </div>
    <div class="field">
      <label for="pfp">Profile Picture</label>
      <input id="pfp" type="file" name="pfp" accept="image/*" />
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 11px;">Create Account</button>
  </form>
  <p style="margin-top: 14px; font-size: 13px; color: var(--muted);">
    <a href="{{ url_for('login') }}">Log In</a>
  </p>
</div>
{% endblock %}
