{% extends "base.html" %}
{% block title %}Create Group — Chatly{% endblock %}

{% block extra_css %}
<style>
  .page-wrap {
    padding: 10px 12px 16px;
  }

  .card {
    background-color: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px;
  }

  .section-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .mobile-input {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background-color: var(--sheet-bg);
    color: var(--text);
    font-size: 13px;
  }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  <div class="card">
    <div class="section-title">Create Group</div>
    <form method="POST" action="{{ url_for('create_group') }}">
      <div style="margin-bottom: 10px;">
        <input type="text" name="group_name" placeholder="Group name" class="mobile-input" required />
      </div>
      <div style="max-height: 240px; overflow-y: auto; margin-bottom: 12px; font-size: 13px;">
        {% for f in friends %}
          <label style="display: flex; align-items: center; gap: 8px; padding: 6px 2px;">
            <input type="checkbox" name="member_ids" value="{{ f.id }}" />
            <span>{{ f.username }} (#{{ f.friend_number }})</span>
          </label>
        {% else %}
          <div style="font-size: 12px; color: var(--muted);">No friends available.</div>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 10px;">Create Group</button>
    </form>
  </div>
</div>
{% endblock %}
