{% extends "base.html" %}
{% block title %}Profile — Message{% endblock %}
{% block content %}
<div class="auth-card" style="max-width: 520px;">
  <h1>Profile</h1>
  <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 18px;">
    {% if user.pfp_filename %}
      <img src="/uploads/{{ user.pfp_filename }}" alt="PFP" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent);" />
    {% else %}
      <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;">
        {{ user.username[0]|upper }}
      </div>
    {% endif %}
    <div>
      <div style="font-size: 18px; font-weight: 700;">{{ user.username }}</div>
      <div style="font-size: 13px; color: var(--muted);">Friend Number: <strong>{{ user.friend_number }}</strong></div>
      <div style="font-size: 13px; color: var(--muted); margin-top: 4px;">{{ user.bio }}</div>
    </div>
  </div>

  <form method="POST" action="/profile" enctype="multipart/form-data">
    <div class="field">
      <label for="username">Edit Username</label>
      <input id="username" type="text" name="username" value="{{ user.username }}" required />
    </div>
    <div class="field">
      <label for="bio">Edit Bio</label>
      <textarea id="bio" name="bio" rows="3">{{ user.bio }}</textarea>
    </div>
    <div class="field">
      <label for="pfp">Update Profile Picture</label>
      <input id="pfp" type="file" name="pfp" accept="image/*" />
    </div>
    <button type="submit" class="btn btn-primary" style="width: 100%;">Save Profile</button>
  </form>
</div>
{% endblock %}
